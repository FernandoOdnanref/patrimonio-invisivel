<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patrimônio Invisível</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,500..800;1,7..72,500..700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: coluna editorial central (max 760px) com faixas de cor por nível, cédulas em grade na home. */
:root {
  --paper: #ECEFE9; --paper-2: #E2E7E0; --ink: #16232C; --muted: #5B686D; --line: #C6CEC6; --screen: #F6F8F3;
  --accent: #2B5D4F; --accent-ink: #FFFFFF; --good: #2E7D4F; --bad: #B13F2D; --warn: #9A6A0E;
  --lv1: #3E6E8E; --lv2: #6B4C9A; --lv3: #A8423A; --lv4: #8C6A0F; --lv5: #B0592A; --lv6: #1F6F78; --lv7: #7A5F48;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --action: #1D5E6A; --action-ink: #FFFFFF;
  --lvc: var(--accent);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1517; --paper-2: #151D20; --ink: #E3E8E2; --muted: #95A2A5; --line: #2B373A; --screen: #131B1E;
  --accent: #7CC4A7; --accent-ink: #0F1517; --good: #6DCB93; --bad: #F08B74; --warn: #E5B95A;
  --lv1: #86B6D6; --lv2: #B7A0E3; --lv3: #EB8F84; --lv4: #E2C15F; --lv5: #F0A070; --lv6: #70C6CF; --lv7: #CDAE92; --action: #7FCAD4; --action-ink: #0F1517; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0F1517; --paper-2: #151D20; --ink: #E3E8E2; --muted: #95A2A5; --line: #2B373A; --screen: #131B1E;
  --accent: #7CC4A7; --accent-ink: #0F1517; --good: #6DCB93; --bad: #F08B74; --warn: #E5B95A;
  --lv1: #86B6D6; --lv2: #B7A0E3; --lv3: #EB8F84; --lv4: #E2C15F; --lv5: #F0A070; --lv6: #70C6CF; --lv7: #CDAE92; --action: #7FCAD4; --action-ink: #0F1517; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
a { color: var(--lvc); }
:focus-visible { outline: 3px solid var(--lvc); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; line-height: 1.15; letter-spacing: -0.005em; }
h4 { font-size: 1rem; margin: 0 0 .3rem; }
.lv1 { --lvc: var(--lv1); } .lv2 { --lvc: var(--lv2); } .lv3 { --lvc: var(--lv3); } .lv4 { --lvc: var(--lv4); }
.lv5 { --lvc: var(--lv5); } .lv6 { --lvc: var(--lv6); } .lv7 { --lvc: var(--lv7); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav a { white-space: nowrap; flex: none; }
.nav a, .btn, button.btn { font-family: var(--f-body); font-size: .9rem; font-weight: 700; text-decoration: none; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.nav a:hover, .btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--action); color: var(--action-ink); border-color: var(--action); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.badge { font-family: var(--f-mono); font-size: .72rem; background: var(--bad); color: var(--paper); border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; }
.sync { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; }
.wrap { max-width: 1080px; margin: 0 auto; }
.col { max-width: 760px; margin: 0 auto; }
.small { font-size: .86rem; color: var(--muted); }
.eyebrow { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--lvc); }

/* Home */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: center; padding-block: 48px 32px; }
.hero h1 { font-size: clamp(2.6rem, 6.4vw, 4.8rem); margin: .2em 0 .25em; }
.hero h1 em { font-style: italic; color: var(--accent); }
.hero p.lead { font-size: 1.15rem; max-width: 34em; }
.hero-art { position: relative; aspect-ratio: 1; max-width: 100%; }
.hero-art canvas { width: 100%; height: 100%; display: block; }
.hero-art .seal { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--f-display); }
.hero-art .seal > div { background: var(--paper); border-radius: 50%; width: 52%; aspect-ratio: 1; display: grid; place-content: center; gap: 4px; box-shadow: 0 0 0 1px var(--line), 0 0 0 10px var(--paper); }
.hero-art .seal b { font-size: clamp(1.5rem, 3.6vw, 2.5rem); display: block; line-height: 1; }
.hero-art .seal span { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.cta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.statline { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 24px; font-size: .9rem; color: var(--muted); }
.statline b { display: block; font-family: var(--f-display); font-size: 1.6rem; color: var(--ink); }

.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-block: 16px 40px; }
.note { position: relative; border: 1.5px solid var(--lvc); border-radius: 14px; padding: 16px; min-height: 178px; overflow: hidden; text-decoration: none; color: var(--ink); background: var(--paper); display: flex; flex-direction: column; gap: 6px; }
.note canvas { position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; opacity: .55; pointer-events: none; }
.note .val { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; color: var(--lvc); line-height: 1; position: relative; }
.note h3 { font-size: 1.25rem; margin: 6px 0 0; position: relative; }
.note .meta { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); margin-top: auto; position: relative; display: flex; justify-content: space-between; gap: 8px; }
.note.locked { border-style: dashed; opacity: .62; }
.note.passed::after { content: "APROVADO"; position: absolute; right: 12px; bottom: 34px; font-family: var(--f-mono); font-size: .68rem; letter-spacing: .14em; color: var(--good); border: 1.5px solid var(--good); padding: 2px 6px; border-radius: 4px; transform: rotate(-6deg); }
.note:hover:not(.locked) { box-shadow: 0 6px 24px color-mix(in srgb, var(--lvc) 22%, transparent); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-top: 28px; }
.section-h h2 { font-size: 1.6rem; margin: 0; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-block: 18px; }
.how div h4 { font-family: var(--f-display); font-size: 1.15rem; }
.how div p { margin: 0; font-size: .95rem; }
.disclaimer { border-left: 3px solid var(--warn); padding: 10px 14px; background: var(--paper-2); font-size: .9rem; border-radius: 0 8px 8px 0; }

/* Level */
.lvhead { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--lvc) 9%, var(--paper)); }
.lvhead canvas { position: absolute; right: -60px; top: -80px; width: 420px; height: 420px; opacity: .5; pointer-events: none; }
.lvhead .col { position: relative; padding-block: 40px 28px; }
.lvhead h1 { font-size: clamp(2.2rem, 5.4vw, 3.6rem); margin: .15em 0 .3em; }
.lvhead .tese { font-size: 1.12rem; max-width: 36em; }
.skills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding: 0; list-style: none; }
.skills li { font-size: .82rem; border: 1px solid var(--lvc); color: var(--lvc); border-radius: 999px; padding: 2px 10px; font-weight: 700; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); margin-inline: auto; max-width: 760px; display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; }
.toc a { white-space: nowrap; font-size: .84rem; font-weight: 700; text-decoration: none; color: var(--muted); padding: 4px 10px; border-radius: 6px; }
.toc a:hover { color: var(--ink); background: var(--paper-2); }
.block { margin-top: 44px; scroll-margin-top: 120px; }
.block > h2 { font-size: 1.9rem; margin: 0 0 14px; display: flex; gap: 12px; align-items: baseline; }
.block > h2 small { font-family: var(--f-mono); font-size: .8rem; color: var(--lvc); letter-spacing: .1em; }
.mission { border: 1.5px solid var(--lvc); border-radius: 14px; padding: 18px 20px; font-size: 1.08rem; }
.lesson { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 22px; }
.lesson h3 { font-size: 1.55rem; margin: 0 0 10px; }
.lesson p, .lesson li { max-width: 68ch; }
.callout { background: color-mix(in srgb, var(--lvc) 9%, var(--paper)); border-radius: 12px; padding: 14px 16px; margin-block: 16px; }
ol.steps { padding-left: 1.2em; } ol.steps li { margin-bottom: 6px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-block: 14px; }
.mini { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.mini h4 { font-family: var(--f-display); font-size: 1.2rem; color: var(--lvc); }
.mini p { margin: 0; font-size: .92rem; }
.table-wrap { overflow-x: auto; margin-block: 12px; }
table.data { border-collapse: collapse; width: 100%; font-size: .93rem; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
table.data th { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td.num { text-align: right; white-space: nowrap; }
a.cite { font-family: var(--f-mono); font-size: .7em; vertical-align: super; text-decoration: none; padding: 0 2px; color: var(--lvc); cursor: pointer; }
.pop { position: absolute; z-index: 30; max-width: min(360px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); border: 1px solid var(--ink); border-radius: 10px; padding: 10px 12px; font-size: .86rem; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
.pop a { display: inline-block; margin-top: 6px; font-weight: 700; }

/* Video */
.vid { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--screen); }
.vid-stage { position: relative; }
.vid-stage canvas { display: block; width: 100%; aspect-ratio: 16 / 9; }
.vid-big { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--lvc); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; top: 78%; }
.vid-cap { padding: 10px 14px; min-height: 3.4em; font-size: .98rem; border-top: 1px solid var(--line); }
.vid-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.vid-play { font-weight: 700; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-family: var(--f-body); }
.vid-track { flex: 1; min-width: 80px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.vid-track span { display: block; height: 100%; width: 0; background: var(--lvc); }
.vid-narr { font-size: .85rem; display: flex; gap: 4px; align-items: center; }
.vid-time { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); }
.vids { display: grid; gap: 18px; }
.vid-stage video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #F6F8F3; }
.vid-dlg { display: flex; gap: 10px; align-items: baseline; line-height: 1.45; }
.vid-sp { flex: none; font-family: var(--f-mono); font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--lvc) 16%, transparent); color: var(--lvc); }
.vid-sp[data-sp="Caio"] { background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--ink); }
.vid-who { flex: 1; font-size: .85rem; color: var(--muted); }
.vid-rate { font-family: var(--f-mono); font-size: .8rem; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; }

/* Exercises */
.ex { border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 18px; background: var(--paper); }
.ex > header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.ex h3 { font-size: 1.3rem; margin: 0; }
.ex .desc { margin: 4px 0 12px; color: var(--muted); font-size: .94rem; }
.donechip { font-family: var(--f-mono); font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
.donechip.ok { color: var(--good); border-color: var(--good); }
label.f { display: block; font-weight: 700; font-size: .93rem; margin: 12px 0 4px; }
input[type=text], input[type=number], input[type=date], textarea, select { width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--screen); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { min-height: 84px; resize: vertical; } textarea.big { min-height: 180px; }
input:focus, textarea:focus, select:focus { border-color: var(--lvc); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--lvc) 25%, transparent); }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.row > * { min-width: 0; }
.result { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
.big-out { font-family: var(--f-display); font-size: 2rem; font-weight: 700; color: var(--lvc); line-height: 1.1; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kv div span { display: block; font-size: .78rem; color: var(--muted); font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .05em; }
.kv div b { font-family: var(--f-mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.ok { color: var(--good); } .bad { color: var(--bad); } .warnc { color: var(--warn); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--lvc); flex: none; }
.debt-row { display: grid; grid-template-columns: 2fr 1.2fr 1fr 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.debt-row.h { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); text-transform: uppercase; }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.2rem; padding: 4px 8px; }
.bars .b { display: grid; grid-template-columns: 110px 1fr 48px; gap: 8px; align-items: center; margin: 6px 0; font-size: .9rem; }
.bars .b i { display: block; height: 14px; border-radius: 3px; background: var(--lvc); }
.bars .b i.vig { background: var(--good); }
.scale { display: flex; gap: 4px; flex-wrap: wrap; }
.scale label { border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; cursor: pointer; font-family: var(--f-mono); font-size: .85rem; }
.scale input { position: absolute; opacity: 0; pointer-events: none; }
.scale input:checked + span { color: var(--accent-ink); }
.scale label:has(input:checked) { background: var(--lvc); border-color: var(--lvc); color: var(--accent-ink); }
.item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
.days button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); font-family: var(--f-mono); font-size: .72rem; cursor: pointer; }
.days button.on { background: var(--lvc); color: var(--accent-ink); border-color: var(--lvc); }
input[type=range] { width: 100%; accent-color: var(--lvc); }
.mentor { margin-top: 12px; border-left: 3px solid var(--lvc); padding: 8px 12px; background: var(--paper-2); border-radius: 0 8px 8px 0; white-space: pre-wrap; font-size: .95rem; }
canvas.sim { width: 100%; aspect-ratio: 2 / 1; display: block; background: var(--screen); border: 1px solid var(--line); border-radius: 10px; }
.saved { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }

/* Quiz */
.q { border-top: 1px solid var(--line); padding: 16px 0; }
.q h4 { font-size: 1.05rem; font-family: var(--f-body); }
.q label { display: flex; gap: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; cursor: pointer; align-items: flex-start; }
.q label input { margin-top: 5px; accent-color: var(--lvc); }
.q label.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.q label.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.q .exp { font-size: .9rem; color: var(--muted); margin-top: 6px; }
.score { border-radius: 14px; padding: 16px 18px; margin-top: 16px; border: 1.5px solid var(--line); }
.score.pass { border-color: var(--good); } .score.fail { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 7%, transparent); }
.lockmsg { border: 1.5px dashed var(--line); border-radius: 14px; padding: 24px; text-align: center; margin-top: 30px; }

/* Panels */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8,12,14,.45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--paper); color: var(--ink); width: min(560px, 100%); max-height: 90vh; overflow: auto; border-radius: 16px; padding: 22px; border: 1px solid var(--line); }
.panel h2 { margin-top: 0; font-size: 1.7rem; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.dots i { width: 14px; height: 14px; border-radius: 3px; background: var(--line); display: block; }
.dots i.on { background: var(--good); }
.card-rev { border: 1.5px solid var(--lvc); border-radius: 16px; padding: 26px; min-height: 220px; display: flex; flex-direction: column; gap: 14px; justify-content: center; margin-top: 18px; }
.card-rev .qq { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.2; }
.card-rev .aa { font-size: 1.1rem; border-top: 1px solid var(--line); padding-top: 12px; }
.src-group { margin-top: 28px; }
.src-group h3 { font-size: 1.3rem; }
.src-list { list-style: none; padding: 0; margin: 0; }
.src-list li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .9rem; display: grid; grid-template-columns: 48px 1fr; gap: 8px; }
.src-list li span.mono { color: var(--muted); font-size: .76rem; }
.src-list li:target { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.const { border: 2px solid var(--ink); border-radius: 6px; padding: 28px; position: relative; overflow: hidden; background: var(--screen); }
.const canvas { position: absolute; inset: auto -80px -80px auto; width: 320px; height: 320px; opacity: .35; pointer-events: none; }
.const h2 { font-size: 2.2rem; margin-top: 0; }
.const section { position: relative; margin-top: 18px; }

iloto automático", "gancho": {"ico": "clock", "q": "Quanto tempo leva um hábito novo?", "x": "A Joana achou que sabia a resposta", "nar": "Oi! Eu sou a Ana. Esta é a Joana. Ela prometeu abrir o app do banco todo dia e guardar um pouco por mês. Toda vez, a promessa durava uma semana. Ela achava que faltava força de vontade. Vamos ver?"}, "cenas": ["A Joana ouviu que um hábito leva vinte e um dias. Ela contou os dias e ficou ansiosa. Mas olhe na tela: vinte e um dias, com um risco em cima. Não é bem assim.", "Pesquisadores acompanharam pessoas criando hábitos novos. No começo, fica fácil bem rápido. Depois, a curva se acalma. No meio do caminho estão os sessenta e seis dias. Teve gente com dezoito e gente com duzentos e cinquenta e quatro.", "No dia treze, a Joana esqueceu. Viu o quadradinho apagado e achou que tinha perdido tudo. Não perdeu. Um dia perdido não zera nada. O que atrapalha é falhar sempre. No dia seguinte, ela voltou.", "Agora, a ideia mais forte de todas: deixar no automático. Numa empresa, quando a previdência virou automática, a participação pulou de trinta e sete para oitenta e seis por cento. A Joana agendou uma transferência para todo dia cinco.", "Automatizar. Criar fricção. Ter um plano se-então. Repetir. A Joana tirou o cartão salvo do app de compras. Ela não ficou mais forte. Ela só arrumou a vida para não precisar resistir."], "fim": {"ico": "hand", "t": "Agora é a sua vez", "x": "Primeiro, os cartões sobre como o hábito funciona", "nar": "Você também pode fazer isso, sem depender de força de vontade. Na próxima parada, a gente vê como o hábito funciona por dentro. Vamos juntos?"}, "endcard": "Toque em “Próxima parada” para continuar", "resumo": {"itens": [["clock", "Quanto tempo leva um hábito"], ["stairs", "Por que um dia perdido não zera"], ["key", "O piloto automático"]], "nar": "Neste vídeo você vai ver três coisas. Quanto tempo leva um hábito. Por que um dia perdido não zera nada. E como ligar o piloto automático."}}, "v6": {"kicker": "PATRIMÔNIO INVISÍVEL · NÍVEL 5 · VÍDEO 1", "titulo": "Riqueza é o que você não vê", "sub": "A Joana descobre quem é rico de verdade no prédio dela", "gancho": {"ico": "eye", "q": "Quem é rico de verdade?", "x": "A resposta surpreendeu a Joana", "nar": "Oi! Eu sou a Ana. A Joana sempre achou que os ricos do prédio eram fáceis de achar. Bastava olhar a garagem. Ela olhava o carro novo dos vizinhos e se sentia para trás. Será que ela estava certa?"}, "cenas": ["No prédio da Joana moram dois vizinhos. Os dois ganham exatamente o mesmo. Um tem o carro do ano. O outro tem um carro de seis anos. Quem você acha que é mais rico?", "Olhe embaixo de cada carro. O do carro do ano tem quase nada guardado. O outro tem um patrimônio que ninguém vê. O carro mostra o que foi gasto. Rico é quem aparece. Abastado é quem guarda.", "Dois pesquisadores criaram uma régua. Idade vezes renda do ano, dividido por dez. Quem tem o dobro disso é acumulador. Metade ou menos, consumidor. A Joana fez a conta: dava quatrocentos e dezoito mil reais. Ela ainda está longe.", "Num estudo com mais de dez mil milionários, setenta e nove por cento não herdaram nada. E noventa e quatro por cento gastam menos do que ganham. E advogado está entre as cinco profissões mais comuns. A Joana sorriu.", "E o tempo é o grande multiplicador. Buffett juntou oitenta e quatro bilhões e meio de dólares. Desses, oitenta e um e meio vieram depois dos sessenta e cinco anos. Gastar menos e esperar fazem a curva subir."], "fim": {"ico": "hand", "t": "Agora é a sua vez", "x": "Primeiro, os cartões sobre quem junta e quem gasta", "nar": "A riqueza de verdade é silenciosa, e começa com o dinheiro que você não gasta. Na próxima parada, vamos ver quem junta e quem gasta. Vem comigo?"}, "endcard": "Toque em “Próxima parada” para continuar", "resumo": {"itens": [["eye", "O que você vê e o que não vê"], ["scale", "A régua do patrimônio"], ["clock", "O tempo multiplicador"]], "nar": "Neste vídeo você vai ver três coisas. A diferença entre o que a gente vê e o que não vê. Uma régua para medir patrimônio. E o poder do tempo."}}, "v1": {"kicker": "PATRIMÔNIO INVISÍVEL · NÍVEL 1 · VÍDEO 1", "titulo": "O ciclo da vergonha", "sub": "Por que a gente foge das contas, e como sair dessa", "gancho": {"ico": "hide", "q": "Por que a Joana não abria a fatura?", "x": "e o que mudou quando ela abriu", "nar": "Oi! Eu sou a Ana. Esta é a Joana. Ela é advogada, trabalha muito, e tinha um segredo. Fazia dois meses que ela não abria a fatura do cartão. Vamos entender por quê."}, "cenas": ["Quando o dinheiro apertou, a Joana não correu para resolver. Ela escondeu. E isso é o que a maioria das pessoas faz.", "Pesquisadores acompanharam mais de duas mil pessoas, durante cinco anos. E viram uma roda. A dívida traz vergonha. A vergonha faz a gente esconder. E esconder traz mais dívida.", "Enquanto a fatura ficava fechada, os juros cresciam, mês após mês. É o efeito avestruz. Não olhar parece proteger. Mas faz a gente decidir tarde demais.", "Um dia, a Joana descobriu uma coisa. Ela não estava sozinha. Em setembro de dois mil e vinte e seis, oitenta e quatro milhões de brasileiros estavam com contas atrasadas. Mais da metade dos adultos.", "Então ela fez diferente. Abriu a fatura. Anotou os números. Fez as contas. E contou para a irmã, a Carla. Quem tem apoio sem julgamento paga mais dívida.", "E a Joana aprendeu uma frase que tirou o peso das costas. Eu tenho uma dívida. Eu não sou uma dívida. Um problema separado de você pode ser medido e resolvido."], "fim": {"ico": "hand", "t": "Agora é a sua vez", "x": "Próxima parada: os pontos principais em cartões", "nar": "Agora é a sua vez de fazer como a Joana. Com calma, um passo de cada vez. Na próxima parada, eu te mostro os pontos principais. Vamos?"}, "endcard": "Toque em “Próxima parada” para continuar", "resumo": {"itens": [["loop", "A roda da vergonha"], ["people", "Você não está sozinho"], ["key", "A frase que tira o peso"]], "nar": "Neste vídeo você vai ver três coisas. A roda da vergonha. Que você não está sozinho. E uma frase que tira o peso das costas."}}, "v10": {"kicker": "PATRIMÔNIO INVISÍVEL · NÍVEL 7 · VÍDEO 2", "titulo": "Dinheiro, controle e o suficiente", "sub": "O que a pesquisa diz sobre dinheiro e felicidade", "gancho": {"ico": "gift", "q": "Dinheiro traz felicidade, afinal?", "x": "A Joana quis saber a verdade", "nar": "Agora que está saindo das dívidas, a Joana tem uma pergunta que muita gente faz baixinho. Se eu ganhar mais, vou ser mais feliz? Pesquisadores estudaram isso a fundo. Veja o que eles descobriram."}, "cenas": ["Para a maioria das pessoas, o bem-estar continua subindo com a renda. Mas cada vez mais devagar. Cada vez que a renda dobra, a felicidade sobe o mesmo degrau.", "E aquele famoso limite, em que o dinheiro para de ajudar? Ele só aparece para os vinte por cento mais infelizes. Para eles, o dinheiro ajuda até um ponto. O resto não é financeiro.", "O que mais explicou essa ligação foi a sensação de controle sobre a própria vida. Cerca de setenta e quatro por cento. A Joana sorriu. Sair das dívidas foi justamente recuperar o controle.", "E como gastar para viver melhor? Comprando tempo, vivendo experiências e gastando com outras pessoas. Até cinco dólares gastos com alguém já mostraram efeito. A Joana marcou um almoço com a irmã, a Carla.", "Por fim, o número da liberdade. Quem gasta noventa e seis mil por ano precisa de uns dois milhões e setecentos mil, a três e meio por cento. No Brasil, use isso como régua, não como promessa."], "fim": {"ico": "hand", "t": "Agora é a sua vez", "x": "Próxima parada: riqueza saudável, passo a passo", "nar": "A Joana descobriu que riqueza boa compra controle, tempo e boas relações. Agora é a sua vez. Na próxima parada, a gente vê isso com calma, passo a passo."}, "endcard": "Toque em “Próxima parada” para continuar", "resumo": {"itens": [["coin", "Dinheiro e bem-estar"], ["key", "O papel do controle"], ["flag", "O número da liberdade"]], "nar": "Neste vídeo você vai ver três coisas. O que a pesquisa diz sobre dinheiro e bem-estar. O papel da sensação de controle. E o número da liberdade."}}, "v2": {"kicker": "PATRIMÔNIO INVISÍVEL · NÍVEL 2 · VÍDEO 1", "titulo": "A fatura que dobra", "sub": "O que acontece quando a gente deixa o rotativo para depois", "gancho": {"ico": "fire", "q": "E se a fatura dobrasse sozinha?", "x": "A história da fatura da Joana", "nar": "Oi! Eu sou a Ana. Lembra da Joana? Ela finalmente abriu a fatura do cartão. Eram dois mil reais no rotativo. E ela pensou: depois eu vejo isso. Vamos ver o que acontece quando a gente deixa para depois."}, "cenas": ["Vamos olhar só a metade dessa fatura: mil reais. No rotativo, a taxa média é de quinze vírgula três por cento ao mês. Todo mês, cada mil reais vira mil cento e cinquenta e três.", "Agora veja os meses passando. Os juros caem em cima dos juros. Mil reais viram mil cento e cinquenta. Depois, mais de mil e trezentos. Em menos de cinco meses, a dívida da Joana já dobrou.", "Desde janeiro de dois mil e vinte e quatro, existe um teto. Os juros não podem passar do valor da dívida. Então os mil reais param em dois mil. Mas o teto limita o total, não a taxa.", "A Joana comparou com outras dívidas. O rotativo custa quatrocentos e cinquenta e um por cento ao ano. O cheque especial, cento e trinta e nove. O consignado, vinte e oito. A ordem de pagar segue o custo.", "Então a Joana fez um plano em três passos. Um: parar de cavar, e congelar o cartão. Dois: montar um para-choque para imprevistos. Três: atacar sempre a dívida mais cara."], "fim": {"ico": "hand", "t": "Agora é a sua vez", "x": "Próxima parada: como parar de cavar", "nar": "A Joana deu o primeiro passo. Agora é a sua vez. Na próxima parada, eu te mostro como parar de cavar e montar o seu para-choque. Vamos juntos?"}, "endcard": "Toque em “Próxima parada” para continuar", "resumo": {"itens": [["fire", "Como os juros crescem"], ["flag", "O teto que existe por lei"], ["list", "O plano em três passos"]], "nar": "Neste vídeo você vai ver três coisas. Como os juros do cartão crescem. O teto que existe por lei. E um plano em três passos."}}, "v7": {"kicker": "PATRIMÔNIO INVISÍVEL · NÍVEL 6 · VÍDEO 2", "titulo": "O jogo que engana a média", "sub": "Por que uma aposta boa na média pode te deixar mais pobre", "gancho": {"ico": "scale", "q": "Um jogo bom pode te deixar mais pobre?", "x": "A Joana quase caiu nessa", "nar": "Um colega mostrou para a Joana uma aposta que parecia imperdível. Na média, todo mundo ganha. Ela ficou tentada a colocar ali tudo o que já guardou. Antes, vamos fazer as contas com ela."}, "cenas": ["A aposta é assim. Deu cara, o dinheiro sobe cinquenta por cento. Deu coroa, cai quarenta. Na média, isso dá mais cinco por cento por rodada. Parece ótimo, não é?", "Agora imagine cem pessoas apostando tudo, por sessenta rodadas. A média do grupo sobe, puxada por poucos sortudos. Mas olhe a linha vermelha. A pessoa típica encolhe cerca de cinco por cento por rodada.", "A Joana entendeu. Ela não vive a média de cem pessoas. Ela vive uma vida só, uma única trajetória. E se o dinheiro dela zerar, ela sai do jogo.", "Por isso, antes de olhar o ganho, ela faz o teste da ruína. Posso perder a reserva? A casa? O crédito? A capacidade de continuar? Se a resposta for sim, ela diminui a aposta ou recusa.", "Uma saída é a estratégia da barra. De oitenta e cinco a noventa por cento bem seguro. De dez a quinze por cento em várias apostas pequenas. Se o lado ousado der errado, a vida da Joana continua."], "fim": {"ico": "hand", "t": "Agora é a sua vez", "x": "Próxima parada: ferramentas para decidir melhor", "nar": "A Joana recusou a aposta de tudo e dormiu tranquila. Agora é a sua vez. Na próxima parada, você aprende ferramentas simples para decidir sem medo."}, "endcard": "Toque em “Próxima parada” para continuar", "resumo": {"itens": [["coin", "Uma aposta tentadora"], ["fire", "O teste da ruína"], ["scale", "A estratégia da barra"]], "nar": "Neste vídeo você vai ver três coisas. Uma aposta que parece ótima. O teste da ruína. E a estratégia da barra."}}};</script>

7, "b": 18.11, "s": 0}, {"sp": "Ana", "t": "Neste vídeo você vai ver três coisas.", "a": 18.11, "b": 21.51, "s": 1}, {"sp": "Ana", "t": "O que a pesquisa diz sobre dinheiro e bem-estar.", "a": 21.51, "b": 25.23, "s": 1}, {"sp": "Ana", "t": "O papel da sensação de controle.", "a": 25.23, "b": 27.39, "s": 1}, {"sp": "Ana", "t": "E o número da liberdade.", "a": 27.39, "b": 30.17, "s": 1}, {"sp": "Ana", "t": "Para a maioria das pessoas, o bem-estar continua subindo com a renda.", "a": 30.17, "b": 35.11, "s": 2}, {"sp": "Ana", "t": "Mas cada vez mais devagar.", "a": 35.11, "b": 37.79, "s": 2}, {"sp": "Ana", "t": "Cada vez que a renda dobra, a felicidade sobe o mesmo degrau.", "a": 37.79, "b": 42.93, "s": 2}, {"sp": "Ana", "t": "E aquele famoso limite, em que o dinheiro para de ajudar?", "a": 42.93, "b": 47.31, "s": 3}, {"sp": "Ana", "t": "Ele só aparece para os vinte por cento mais infelizes.", "a": 47.31, "b": 51.35, "s": 3}, {"sp": "Ana", "t": "Para eles, o dinheiro ajuda até um ponto.", "a": 51.35, "b": 54.31, "s": 3}, {"sp": "Ana", "t": "O resto não é financeiro.", "a": 54.31, "b": 56.77, "s": 3}, {"sp": "Ana", "t": "O que mais explicou essa ligação foi a sensação de controle sobre a própria vida.", "a": 56.77, "b": 62.79, "s": 4}, {"sp": "Ana", "t": "Cerca de setenta e quatro por cento.", "a": 62.79, "b": 65.33, "s": 4}, {"sp": "Ana", "t": "A Joana sorriu.", "a": 65.33, "b": 67.41, "s": 4}, {"sp": "Ana", "t": "Sair das dívidas foi justamente recuperar o controle.", "a": 67.41, "b": 71.43, "s": 4}, {"sp": "Ana", "t": "E como gastar para viver melhor?", "a": 71.43, "b": 73.97, "s": 5}, {"sp": "Ana", "t": "Comprando tempo, vivendo experiências e gastando com outras pessoas.", "a": 73.97, "b": 79.61, "s": 5}, {"sp": "Ana", "t": "Até cinco dólares gastos com alguém já mostraram efeito.", "a": 79.61, "b": 84.05, "s": 5}, {"sp": "Ana", "t": "A Joana marcou um almoço com a irmã, a Carla.", "a": 84.05, "b": 87.93, "s": 5}, {"sp": "Ana", "t": "Por fim, o número da liberdade.", "a": 87.93, "b": 90.73, "s": 6}, {"sp": "Ana", "t": "Quem gasta noventa e seis mil por ano precisa de uns dois milhões e setecentos mil, a três e meio por cento.", "a": 90.73, "b": 98.93, "s": 6}, {"sp": "Ana", "t": "No Brasil, use isso como régua, não como promessa.", "a": 98.93, "b": 103.57, "s": 6}, {"sp": "Ana", "t": "A Joana descobriu que riqueza boa compra controle, tempo e boas relações.", "a": 103.57, "b": 109.65, "s": 7}, {"sp": "Ana", "t": "Agora é a sua vez.", "a": 109.65, "b": 111.75, "s": 7}, {"sp": "Ana", "t": "Na próxima parada, a gente vê isso com calma, passo a passo.", "a": 111.75, "b": 116.25, "s": 7}], "pre": 3.5, "post": 4.0}, "v2": {"scenes": [3.5, 16.09, 9.96, 15.96, 16.32, 14.2, 14.6, 14.08, 10.18, 4.0], "cues": [{"sp": "Ana", "t": "Oi! Eu sou a Ana.", "a": 3.5, "b": 5.35, "s": 0}, {"sp": "Ana", "t": "Lembra da Joana? Ela finalmente abriu a fatura do cartão.", "a": 5.35, "b": 10.27, "s": 0}, {"sp": "Ana", "t": "Eram dois mil reais no rotativo.", "a": 10.27, "b": 12.51, "s": 0}, {"sp": "Ana", "t": "E ela pensou: depois eu vejo isso.", "a": 12.51, "b": 15.93, "s": 0}, {"sp": "Ana", "t": "Vamos ver o que acontece quando a gente deixa para depois.", "a": 15.93, "b": 19.59, "s": 0}, {"sp": "Ana", "t": "Neste vídeo você vai ver três coisas.", "a": 19.59, "b": 22.79, "s": 1}, {"sp": "Ana", "t": "Como os juros do cartão crescem.", "a": 22.79, "b": 24.95, "s": 1}, {"sp": "Ana", "t": "O teto que existe por lei. E um plano em três passos.", "a": 24.95, "b": 29.55, "s": 1}, {"sp": "Ana", "t": "Vamos olhar só a metade dessa fatura: mil reais.", "a": 29.55, "b": 33.81, "s": 2}, {"sp": "Ana", "t": "No rotativo, a taxa média é de quinze vírgula três por cento ao mês.", "a": 33.81, "b": 39.91, "s": 2}, {"sp": "Ana", "t": "Todo mês, cada mil reais vira mil cento e cinquenta e três.", "a": 39.91, "b": 45.51, "s": 2}, {"sp": "Ana", "t": "Agora veja os meses passando.", "a": 45.51, "b": 48.11, "s": 3}, {"sp": "Ana", "t": "Os juros caem em cima dos juros.", "a": 48.11, "b": 50.99, "s": 3}, {"sp": "Ana", "t": "Mil reais viram mil cento e cinquenta.", "a": 50.99, "b": 54.05, "s": 3}, {"sp": "Ana", "t": "Depois, mais de mil e trezentos.", "a": 54.05, "b": 57.09, "s": 3}, {"sp": "Ana", "t": "Em menos de cinco meses, a dívida da Joana já dobrou.", "a": 57.09, "b": 61.83, "s": 3}, {"sp": "Ana", "t": "Desde janeiro de dois mil e vinte e quatro, existe um teto.", "a": 61.83, "b": 66.01, "s": 4}, {"sp": "Ana", "t": "Os juros não podem passar do valor da dívida.", "a": 66.01, "b": 69.19, "s": 4}, {"sp": "Ana", "t": "Então os mil reais param em dois mil.", "a": 69.19, "b": 72.17, "s": 4}, {"sp": "Ana", "t": "Mas o teto limita o total, não a taxa.", "a": 72.17, "b": 76.03, "s": 4}, {"sp": "Ana", "t": "A Joana comparou com outras dívidas.", "a": 76.03, "b": 78.85, "s": 5}, {"sp": "Ana", "t": "O rotativo custa quatrocentos e cinquenta e um por cento ao ano.", "a": 78.85, "b": 83.11, "s": 5}, {"sp": "Ana", "t": "O cheque especial, cento e trinta e nove.", "a": 83.11, "b": 85.93, "s": 5}, {"sp": "Ana", "t": "O consignado, vinte e oito.", "a": 85.93, "b": 88.49, "s": 5}, {"sp": "Ana", "t": "A ordem de pagar segue o custo.", "a": 88.49, "b": 90.63, "s": 5}, {"sp": "Ana", "t": "Então a Joana fez um plano em três passos.", "a": 90.63, "b": 94.27, "s": 6}, {"sp": "Ana", "t": "Um: parar de cavar, e congelar o cartão.", "a": 94.27, "b": 97.79, "s": 6}, {"sp": "Ana", "t": "Dois: montar um para-choque para imprevistos.", "a": 97.79, "b": 101.21, "s": 6}, {"sp": "Ana", "t": "Três: atacar sempre a dívida mais cara.", "a": 101.21, "b": 104.71, "s": 6}, {"sp": "Ana", "t": "A Joana deu o primeiro passo.", "a": 104.71, "b": 106.85, "s": 7}, {"sp": "Ana", "t": "Agora é a sua vez.", "a": 106.85, "b": 108.61, "s": 7}, {"sp": "Ana", "t": "Na próxima parada, eu te mostro como parar de cavar e montar o seu para-choque.", "a": 108.61, "b": 113.89, "s": 7}, {"sp": "Ana", "t": "Vamos juntos?", "a": 113.89, "b": 114.89, "s": 7}], "pre": 3.5, "post": 4.0}, "v3": {"scenes": [3.5, 16.07, 10.92, 15.9, 13.96, 15.76, 12.98, 12.86, 10.38, 4.0], "cues": [{"sp": "Ana", "t": "A Joana congelou o cartão e montou o para-choque.", "a": 3.5, "b": 8.09, "s": 0}, {"sp": "Ana", "t": "Agora sobram seiscentos reais por mês, além dos mínimos.", "a": 8.09, "b": 12.73, "s": 0}, {"sp": "Ana", "t": "E vem a dúvida: dividir um pouco para cada dívida, ou colocar tudo numa só?", "a": 12.73, "b": 19.57, "s": 0}, {"sp": "Ana", "t": "Neste vídeo você vai ver três coisas.", "a": 19.57, "b": 22.85, "s": 1}, {"sp": "Ana", "t": "O que acontece quando a gente espalha o dinheiro.", "a": 22.85, "b": 25.79, "s": 1}, {"sp": "Ana", "t": "Como funciona a avalanche.", "a": 25.79, "b": 27.47, "s": 1}, {"sp": "Ana", "t": "E as duas regras de ouro.", "a": 27.47, "b": 30.49, "s": 1}, {"sp": "Ana", "t": "Para ficar fácil de ver, imagine três dívidas: rotativo, cheque especial e empréstimo pessoal.", "a": 30.49, "b": 39.19, "s": 2}, {"sp": "Ana", "t": "A primeira ideia da Joana foi espalhar.", "a": 39.19, "b": 42.15, "s": 2}, {"sp": "Ana", "t": "Um pouquinho para cada uma, do tamanho de cada dívida.", "a": 42.15, "b": 46.39, "s": 2}, {"sp": "Ana", "t": "Pesquisadores viram que quase todo mundo faz assim, sem olhar os juros.", "a": 46.39, "b": 51.35, "s": 3}, {"sp": "Ana", "t": "Cada dívida diminui um pouquinho.", "a": 51.35, "b": 53.87, "s": 3}, {"sp": "Ana", "t": "Mas nenhuma some. E todas continuam cobrando juros, todo mês.", "a": 53.87, "b": 60.35, "s": 3}, {"sp": "Ana", "t": "Agora, a avalanche.", "a": 60.35, "b": 62.79, "s": 4}, {"sp": "Ana", "t": "O mínimo em todas, e todo o resto numa só: a de maior taxa, o rotativo.", "a": 62.79, "b": 69.31, "s": 4}, {"sp": "Ana", "t": "Ele some primeiro. E a parcela dele vai inteira para o cheque especial.", "a": 69.31, "b": 76.11, "s": 4}, {"sp": "Ana", "t": "Pesquisadores olharam dados de seis mil pessoas.", "a": 76.11, "b": 79.65, "s": 5}, {"sp": "Ana", "t": "Quem concentrou o pagamento numa dívida só quitou cerca de quinze por cento mais rápido.", "a": 79.65, "b": 85.19, "s": 5}, {"sp": "Ana", "t": "Ver uma dívida sumir dá ânimo para continuar.", "a": 85.19, "b": 89.09, "s": 5}, {"sp": "Ana", "t": "Então a Joana guardou duas regras.", "a": 89.09, "b": 91.89, "s": 6}, {"sp": "Ana", "t": "Quem decide a ordem é o custo: a mais cara primeiro.", "a": 91.89, "b": 94.99, "s": 6}, {"sp": "Ana", "t": "E o formato é uma por vez, vendo o progresso.", "a": 94.99, "b": 99.09, "s": 6}, {"sp": "Ana", "t": "Simples assim.", "a": 99.09, "b": 101.95, "s": 6}, {"sp": "Ana", "t": "Gostou? Agora é a sua vez.", "a": 101.95, "b": 104.99, "s": 7}, {"sp": "Ana", "t": "Na próxima parada, a gente vê a regra da avalanche em cartões rapidinhos.", "a": 104.99, "b": 109.61, "s": 7}, {"sp": "Ana", "t": "Depois, você monta o seu plano de ataque.", "a": 109.61, "b": 112.33, "s": 7}], "pre": 3.5, "post": 4.0}, "v4": {"scenes": [3.5, 13.37, 11.86, 13.7, 17.88, 12.64, 11.25, 2.53, 0.51, 4.0], "cues": [{"sp": "Ana", "t": "Oi! Eu sou a Ana.", "a": 3.5, "b": 5.47, "s": 0}, {"sp": "Ana", "t": "A Joana já tem um plano de ataque.", "a": 5.47, "b": 7.99, "s": 0}, {"sp": "Ana", "t": "Mas toda vez que um cliente atrasa, ela pensa: preciso trabalhar mais.", "a": 7.99, "b": 13.19, "s": 0}, {"sp": "Ana", "t": "De onde vem essa frase?", "a": 13.19, "b": 14.95, "s": 0}, {"sp": "Ana", "t": "Vamos descobrir juntos.", "a": 14.95, "b": 16.87, "s": 0}, {"sp": "Ana", "t": "Neste vídeo você vai ver três coisas.", "a": 16.87, "b": 19.81, "s": 1}, {"sp": "Ana", "t": "Os quatro roteiros do dinheiro.", "a": 19.81, "b": 21.95, "s": 1}, {"sp": "Ana", "t": "O que cada um provoca. E como trocar a frase que manda em você.", "a": 21.95, "b": 28.73, "s": 1}, {"sp": "Ana", "t": "Por trás de cada hábito existe uma frase que a gente aprendeu cedo.", "a": 28.73, "b": 34.03, "s": 2}, {"sp": "Ana", "t": "Um psicólogo pediu a quatrocentas e vinte e duas pessoas que dessem nota a frases sobre dinheiro.", "a": 34.03, "b": 40.23, "s": 2}, {"sp": "Ana", "t": "Apareceram quatro roteiros.", "a": 40.23, "b": 42.43, "s": 2}, {"sp": "Ana", "t": "Evitação: eu não mereço.", "a": 42.43, "b": 45.09, "s": 3}, {"sp": "Ana", "t": "Adoração: mais dinheiro resolveria tudo.", "a": 45.09, "b": 48.71, "s": 3}, {"sp": "Ana", "t": "Status: eu valho o que tenho.", "a": 48.71, "b": 50.73, "s": 3}, {"sp": "Ana", "t": "E vigilância: dinheiro se cuida com atenção.", "a": 50.73, "b": 56.59, "s": 3}, {"sp": "Ana", "t": "A Joana se reconheceu na adoração.", "a": 56.59, "b": 60.31, "s": 3}, {"sp": "Ana", "t": "Três roteiros andam junto com menos dinheiro.", "a": 60.31, "b": 63.27, "s": 4}, {"sp": "Ana", "t": "A adoração combina com saldo rolado no cartão e com trabalhar demais, igualzinho à Joana.", "a": 63.27, "b": 69.45, "s": 4}, {"sp": "Ana", "t": "Só a vigilância está ligada a não carregar dívida.", "a": 69.45, "b": 72.95, "s": 4}, {"sp": "Ana", "t": "Mas calma: isso não é sentença.", "a": 72.95, "b": 75.41, "s": 5}, {"sp": "Ana", "t": "Essas frases podem mudar. A Joana aprendeu seis passos: o que aconteceu, a frase, a emoção, as provas, uma frase mais justa e uma ação.", "a": 75.41, "b": 84.2, "s": 5}, {"sp": "Ana", "t": "Por último, ela trocou o sonho pela precisão. Só imaginar o sucesso tira a energia.", "a": 84.2, "b": 86.37, "s": 6}, {"sp": "Ana", "t": "Ver o desejo, ver o obstáculo e ter um plano pronto: isso funciona.", "a": 86.37, "b": 86.73, "s": 6}, {"sp": "Ana", "t": "Agora é a sua vez de descobrir as suas frases. Na próxima parada, tem cartões rapidinhos sobre os quatro roteiros. Sem julgamento, combinado? Vamos lá.", "a": 86.73, "b": 87.24, "s": 7}], "pre": 3.5, "post": 4.0}, "v5": {"scenes": [3.5, 17.75, 10.66, 14.64, 17.98, 16.04, 17.34, 14.4, 11.03, 4.0], "cues": [{"sp": "Ana", "t": "Oi! Eu sou a Ana.", "a": 3.5, "b": 5.63, "s": 0}, {"sp": "Ana", "t": "Esta é a Joana.", "a": 5.63, "b": 7.61, "s": 0}, {"sp": "Ana", "t": "Ela prometeu abrir o app do banco todo dia e guardar um pouco por mês.", "a": 7.61, "b": 13.25, "s": 0}, {"sp": "An  "s": 2}, {"sp": "Ana", "t": "Parece ótimo, não é?", "a": 38.93, "b": 41.09, "s": 2}, {"sp": "Ana", "t": "Agora imagine cem pessoas apostando tudo, por sessenta rodadas.", "a": 41.09, "b": 46.31, "s": 3}, {"sp": "Ana", "t": "A média do grupo sobe, puxada por poucos sortudos.", "a": 46.31, "b": 50.45, "s": 3}, {"sp": "Ana", "t": "Mas olhe a linha vermelha.", "a": 50.45, "b": 52.43, "s": 3}, {"sp": "Ana", "t": "A pessoa típica encolhe cerca de cinco por cento por rodada.", "a": 52.43, "b": 57.01, "s": 3}, {"sp": "Ana", "t": "A Joana entendeu.", "a": 57.01, "b": 58.69, "s": 4}, {"sp": "Ana", "t": "Ela não vive a média de cem pessoas.", "a": 58.69, "b": 60.93, "s": 4}, {"sp": "Ana", "t": "Ela vive uma vida só, uma única trajetória.", "a": 60.93, "b": 65.13, "s": 4}, {"sp": "Ana", "t": "E se o dinheiro dela zerar, ela sai do jogo.", "a": 65.13, "b": 68.37, "s": 4}, {"sp": "Ana", "t": "Por isso, antes de olhar o ganho, ela faz o teste da ruína.", "a": 68.37, "b": 73.11, "s": 5}, {"sp": "Ana", "t": "Posso perder a reserva?", "a": 73.11, "b": 74.85, "s": 5}, {"sp": "Ana", "t": "A casa? O crédito?", "a": 74.85, "b": 76.79, "s": 5}, {"sp": "Ana", "t": "A capacidade de continuar?", "a": 76.79, "b": 78.91, "s": 5}, {"sp": "Ana", "t": "Se a resposta for sim, ela diminui a aposta ou recusa.", "a": 78.91, "b": 83.43, "s": 5}, {"sp": "Ana", "t": "Uma saída é a estratégia da barra.", "a": 83.43, "b": 85.95, "s": 6}, {"sp": "Ana", "t": "De oitenta e cinco a noventa por cento bem seguro.", "a": 85.95, "b": 89.95, "s": 6}, {"sp": "Ana", "t": "De dez a quinze por cento em várias apostas pequenas.", "a": 89.95, "b": 93.63, "s": 6}, {"sp": "Ana", "t": "Se o lado ousado der errado, a vida da Joana continua.", "a": 93.63, "b": 97.77, "s": 6}, {"sp": "Ana", "t": "A Joana recusou a aposta de tudo e dormiu tranquila.", "a": 97.77, "b": 101.71, "s": 7}, {"sp": "Ana", "t": "Agora é a sua vez.", "a": 101.71, "b": 103.37, "s": 7}, {"sp": "Ana", "t": "Na próxima parada, você aprende ferramentas simples para decidir sem medo.", "a": 103.37, "b": 107.89, "s": 7}], "pre": 3.5, "post": 4.0}, "v8": {"scenes": [3.5, 16.61, 11.58, 14.5, 15.5, 14.8, 14.6, 15.92, 14.02, 4.0], "cues": [{"sp": "Ana", "t": "Oi! Eu sou a Ana.", "a": 3.5, "b": 5.47, "s": 0}, {"sp": "Ana", "t": "Esta é a Joana.", "a": 5.47, "b": 7.13, "s": 0}, {"sp": "Ana", "t": "Ela está quase saindo das dívidas caras e já pensa em investir.", "a": 7.13, "b": 12.01, "s": 0}, {"sp": "Ana", "t": "Mas tem uma dúvida.", "a": 12.01, "b": 14.11, "s": 0}, {"sp": "Ana", "t": "Com tão pouco para guardar, ainda vale a pena começar?", "a": 14.11, "b": 18.17, "s": 0}, {"sp": "Ana", "t": "Vamos ver juntas.", "a": 18.17, "b": 20.11, "s": 0}, {"sp": "Ana", "t": "Neste vídeo você vai ver três coisas.", "a": 20.11, "b": 23.47, "s": 1}, {"sp": "Ana", "t": "A história de Helena e Marta.", "a": 23.47, "b": 26.21, "s": 1}, {"sp": "Ana", "t": "O juro composto dos dois lados.", "a": 26.21, "b": 29.09, "s": 1}, {"sp": "Ana", "t": "E o peso das taxas.", "a": 29.09, "b": 31.69, "s": 1}, {"sp": "Ana", "t": "A Joana achou um exemplo do Banco Central.", "a": 31.69, "b": 35.47, "s": 2}, {"sp": "Ana", "t": "Helena guardou cento e cinquenta reais por mês, dos vinte aos trinta anos.", "a": 35.47, "b": 41.49, "s": 2}, {"sp": "Ana", "t": "Depois, parou.", "a": 41.49, "b": 43.39, "s": 2}, {"sp": "Ana", "t": "Nunca mais depositou nada.", "a": 43.39, "b": 46.19, "s": 2}, {"sp": "Ana", "t": "Marta só começou aos trinta.", "a": 46.19, "b": 48.71, "s": 3}, {"sp": "Ana", "t": "Guardou o mesmo valor até os sessenta anos.", "a": 48.71, "b": 52.57, "s": 3}, {"sp": "Ana", "t": "Helena depositou dezoito mil reais.", "a": 52.57, "b": 55.79, "s": 3}, {"sp": "Ana", "t": "Marta depositou cinquenta e quatro mil.", "a": 55.79, "b": 58.37, "s": 3}, {"sp": "Ana", "t": "Três vezes mais.", "a": 58.37, "b": 61.69, "s": 3}, {"sp": "Ana", "t": "Aos sessenta anos, as duas têm quase o mesmo: cerca de cento e cinquenta mil reais cada uma.", "a": 61.69, "b": 68.63, "s": 4}, {"sp": "Ana", "t": "O tempo fez o trabalho do dinheiro que Helena não depositou.", "a": 68.63, "b": 73.41, "s": 4}, {"sp": "Ana", "t": "A Joana ficou de boca aberta.", "a": 73.41, "b": 76.49, "s": 4}, {"sp": "Ana", "t": "Mas a Joana lembrou de uma coisa.", "a": 76.49, "b": 79.11, "s": 5}, {"sp": "Ana", "t": "O juro composto não escolhe lado.", "a": 79.11, "b": 81.91, "s": 5}, {"sp": "Ana", "t": "Ele vale para investimentos e vale para dívidas.", "a": 81.91, "b": 85.73, "s": 5}, {"sp": "Ana", "t": "A mesma força que ajudou Helena cresce contra quem rola o cartão.", "a": 85.73, "b": 91.09, "s": 5}, {"sp": "Ana", "t": "As taxas também crescem com o tempo.", "a": 91.09, "b": 94.65, "s": 6}, {"sp": "Ana", "t": "Cem mil reais, por trinta anos, a seis por cento, viram quinhentos e setenta e quatro mil.", "a": 94.65, "b": 102.61, "s": 6}, {"sp": "Ana", "t": "A cinco por cento, só quatrocentos e trinta e dois mil.", "a": 102.61, "b": 107.01, "s": 6}, {"sp": "Ana", "t": "Então a Joana decidiu.", "a": 107.01, "b": 109.35, "s": 7}, {"sp": "Ana", "t": "Primeiro, quitar o que é caro.", "a": 109.35, "b": 111.37, "s": 7}, {"sp": "Ana", "t": "Depois, começar cedo, com produto simples e barato.", "a": 111.37, "b": 117.17, "s": 7}, {"sp": "Ana", "t": "Na próxima parada, eu te mostro a escada do investidor.", "a": 117.17, "b": 121.03, "s": 7}], "pre": 3.5, "post": 4.0}, "v9": {"scenes": [3.5, 14.59, 10.68, 11.38, 15.9, 13.22, 13.34, 14.64, 9.28, 4.0], "cues": [{"sp": "Ana", "t": "Oi! Eu sou a Ana.", "a": 3.5, "b": 5.51, "s": 0}, {"sp": "Ana", "t": "Esta é a Joana, advogada.", "a": 5.51, "b": 8.53, "s": 0}, {"sp": "Ana", "t": "Ela trabalha muito e, mesmo assim, sente que o dinheiro não rende.", "a": 8.53, "b": 13.41, "s": 0}, {"sp": "Ana", "t": "Um almoço com um colega mudou o jeito dela de olhar para o próprio tempo.", "a": 13.41, "b": 18.09, "s": 0}, {"sp": "Ana", "t": "Neste vídeo você vai ver três coisas.", "a": 18.09, "b": 21.13, "s": 1}, {"sp": "Ana", "t": "Como fazer a conta da hora real.", "a": 21.13, "b": 23.29, "s": 1}, {"sp": "Ana", "t": "Por que trabalhar mais não resolve.", "a": 23.29, "b": 25.45, "s": 1}, {"sp": "Ana", "t": "E como fazer cada hora valer mais.", "a": 25.45, "b": 28.77, "s": 1}, {"sp": "Ana", "t": "No almoço, o colega Paulo contou, todo orgulhoso: eu cobro quatrocentos reais por hora.", "a": 28.77, "b": 34.83, "s": 2}, {"sp": "Ana", "t": "A Joana ficou com inveja.", "a": 34.83, "b": 37.09, "s": 2}, {"sp": "Ana", "t": "Mas será que essa é a hora de verdade dele?", "a": 37.09, "b": 40.15, "s": 2}, {"sp": "Ana", "t": "Ela pediu para ele somar todas as horas.", "a": 40.15, "b": 43.05, "s": 3}, {"sp": "Ana", "t": "O fórum. O WhatsApp às dez da noite.", "a": 43.05, "b": 45.99, "s": 3}, {"sp": "Ana", "t": "O e-mail de domingo. O trânsito.", "a": 45.99, "b": 48.91, "s": 3}, {"sp": "Ana", "t": "Só um terço era cobrado.", "a": 48.91, "b": 51.29, "s": 3}, {"sp": "Ana", "t": "Duzentos e quarenta mil reais por ano, divididos por três mil horas.", "a": 51.29, "b": 56.05, "s": 3}, {"sp": "Ana", "t": "Resultado: a hora real do Paulo é oitenta reais, e não quatrocentos.", "a": 56.05, "b": 60.19, "s": 4}, {"sp": "Ana", "t": "A Joana pensou na dela.", "a": 60.19, "b": 63.15, "s": 4}, {"sp": "Ana", "t": "Esse número diz o que vale a pena passar para alguém, automatizar ou parar de fazer.", "a": 63.15, "b": 69.27, "s": 4}, {"sp": "Ana", "t": "A primeira ideia da Joana foi trabalhar ainda mais.", "a": 69.27, "b": 72.53, "s": 5}, {"sp": "Ana", "t": "Só que não funciona.", "a": 72.53, "b": 74.31, "s": 5}, {"sp": "Ana", "t": "Acima de umas quarenta e nove horas por semana, a produção quase não sobe.", "a": 74.31, "b": 79.03, "s": 5}, {"sp": "Ana", "t": "Setenta horas rendem pouco mais que cinquenta e seis.", "a": 79.03, "b": 82.61, "s": 5}, {"sp": "Ana", "t": "O caminho é fazer cada hora valer mais.", "a": 82.61, "b": 85.83, "s": 6}, {"sp": "Ana", "t": "Cobrar pelo valor. Fazer a primeira oferta, a âncora.", "a": 85.83, "b": 90.45, "s": 6}, {"sp": "Ana", "t": "Usar código e mídia, que não pedem permissão.", "a": 90.45, "b": 93.39, "s": 6}, {"sp": "Ana", "t": "E usar a inteligência artificial só onde ela acerta.", "a": 93.39, "b": 97.25, "s": 6}, {"sp": "Ana", "t": "A Joana saiu do almoço decidida a fazer a própria conta.", "a": 97.25, "b": 101.27, "s": 7}, {"sp": "Ana", "t": "Agora é a sua vez.", "a": 101.27, "b": 102.93, "s": 7}, {"sp": "Ana", "t": "Na próxima parada, eu te mostro como descobrir a sua hora real.", "a": 102.93, "b": 106.53, "s": 7}], "pre": 3.5, "post": 4.0}};</script>

      t: 'A vergonha é o juro mais caro',
      body: `<p>Gladstone e colegas acompanharam mais de 2.000 pessoas por cinco anos e encontraram um ciclo: dificuldade financeira gera vergonha, e a vergonha gera mais dificuldade financeira depois {{1:20}}. O mecanismo não é falta de inteligência. É esconder-se do problema. Num experimento, quem foi induzido a sentir vergonha ficou menos propenso a abrir um e-mail sobre uma conta atrasada.</p>
<p>O medo de ser julgado leva o endividado a esconder a dívida, a gastar para acompanhar os amigos e a evitar ajuda. Num experimento de campo, endividados que temiam o estigma pagaram <strong>mais</strong> dívida quando estudaram em grupo do que sozinhos {{1:21}}. A vergonha isola. O que tira você do ciclo é exposição controlada aos números e apoio sem julgamento.</p>
<p>Existe também o <em>efeito avestruz</em>: investidores consultam a carteira com mais frequência quando o mercado sobe do que quando cai {{1:30}}. É o mesmo reflexo de não abrir a fatura "porque sei que está ruim". Ele parece proteger, mas na prática garante que a decisão será tomada tarde.</p>

<p>A primeira mudança é de linguagem. Diga "eu <em>tenho</em> uma dívida", nunca "eu <em>sou</em> um fracasso". A frase separa a pessoa do problema, e um problema separado de você pode ser medido, dividido e resolvido.</p>`,

<p>Se o seu número for negativo, ótimo: agora você sabe. A meta do primeiro ano de quem está no vermelho é chegar a zero, não "ficar rico" {{4:1}}. Patrimônio negativo chegando a zero é uma das maiores taxas de retorno que você terá na vida, porque cada real quitado de rotativo "rende" o juro que deixou de ser cobrado.</p>
<p>Por que isso muda o comportamento? Porque registrar o progresso melhora o alcance de metas, e o efeito é maior quando o registro é físico e quando é reportado a alguém {{3:27}}. Você vai recalcular esse número a cada nível do curso.</p>

<p>O segundo é montar um <strong>para-choque</strong>: uma mini-reserva (de R$ 1.000 a meio mês de gastos) num lugar com resgate imediato, como o Tesouro Reserva ou um CDB de liquidez diária de banco sólido, dentro do limite do FGC {{2:36}} {{2:35}}. Sem ele, o primeiro pneu furado manda você de volta ao rotativo, a cerca de 15% ao mês. O valor exato é recomendação prática, não resultado de estudo.</p>
<p>Por que tanto cuidado? Preocupação financeira ocupa a mente. O famoso estudo de Mani e colegas comparou o efeito a uma noite sem dormir {{1:8}}. A evidência posterior é mais modesta: uma meta-análise de 2024 confirmou associação entre escassez e pior desempenho cognitivo, menor quando se controla escolaridade {{1:15}}. A lição prática continua: <strong>não tome decisão financeira grande no sufoco</strong>. Escreva o plano com calma, espere 24 horas antes de assinar qualquer crédito novo.</p>`,

    {
      t: 'Orçamento base zero e a lei a seu favor',

<p>Se as parcelas somadas deixam menos do que o mínimo existencial para viver, o caminho pode ser a <strong>repactuação por superendividamento</strong> (art. 104-A do CDC, incluído pela Lei 14.181/2021): audiência com todos os credores e plano de até 5 anos. O credor que falta sem justificativa tem a cobrança suspensa e passa a receber depois dos presentes {{2:25}}. A fase de conciliação também pode ser feita no Procon {{2:26}}. Ficam de fora dívidas com garantia real, financiamento imobiliário e crédito rural.</p>

<p>Nas análises, as crenças explicaram 25% da variação na compra compulsiva {{1:2}}. Os autores avisam que são correlações numa amostra de conveniência, e que não se sabe se a crença vem antes da renda baixa ou depois {{1:1}}. Use o inventário como espelho, não como diagnóstico.</p>
<p>De onde vêm essas frases? Os pais são o principal agente de socialização financeira, e os filhos imitam tanto os comportamentos saudáveis quanto os ruins {{1:19}}. Hábitos mentais começam a se formar cedo {{1:17}}, mas isso não quer dizer que sejam imutáveis: terapia financeira e TCC tratam esses roteiros como modificáveis {{1:7}} {{1:26}}.</p>
<div class="callout"><b>Para um advogado, atenção à adoração.</b> A crença "mais dinheiro resolve" previu workaholismo {{1:8}}. Trabalhar mais pode ser sintoma da crença, não a solução. O Nível 7 trata disso com números.</div>`,

    {
      t: 'Registro de pensamentos: a crença no banco dos réus',
      body: `<p>A abordagem com melhor evidência para mudar comportamento financeiro problemático é a terapia cognitivo-comportamental. Num ensaio randomizado com 60 pacientes, 12 sessões de TCC em grupo reduziram a compra compulsiva, com melhora mantida após 6 meses, e quem faltou mais respondeu menos {{1:26}}. Uma revisão de 2022 recomenda a TCC em grupo como primeira linha, com base de qualidade baixa a moderada {{1:27}}.</p>
<p>A ferramenta central é o registro de pensamentos. Você trata a crença como uma tese que precisa de provas:</p>
<ol class="steps">
<li><b>Gatilho:</b> o que aconteceu (boleto, convite caro, cliente atrasou honorários).</li>
<li><b>Pensamento automático:</b> a frase que surgiu ("advogado não pode parecer duro").</li>
<li><b>Emoção e intensidade</b> de 0 a 100.</li>
<li><b>Provas a favor e contra</b> a frase.</li>
<li><b>Pensamento alternativo</b> equilibrado.</li>
<li><b>Ação concreta</b> e nova nota da emoção.</li>
</ol>
<p>Faça diariamente por quatro semanas. Isto não substitui terapia: se a ansiedade for intensa ou houver compra compulsiva, procure um profissional. Dívida se associa a chance mais de três vezes maior de problema de saúde mental (correlação, não causa) {{2:10}}. Se precisar conversar agora, o CVV atende pelo 188.</p>`,

    {
      t: 'Por que "visualizar a riqueza" atrapalha, e o que fazer no lugar',
      body: `<p>A lei da atração é classificada como pseudociência: apoia-se em depoimentos e culpa a vítima pela própria pobreza {{1:33}}. Pior, fantasiar positivamente o futuro desejado reduziu a energia, e quem fantasiou sobre a semana seguinte cumpriu menos metas {{1:28}}. Recém-formados que mais fantasiavam com o emprego enviaram menos currículos e receberam menos ofertas {{3:16}}.</p>
<p>Também não basta "mudar o mindset": intervenções de mentalidade de crescimento tiveram efeito médio de d = 0,08 na educação, e os próprios autores dizem que os benefícios foram exagerados {{1:25}}.</p>
<p>O que funciona é o <strong>contraste mental</strong> com plano, o WOOP: desejo, melhor resultado, obstáculo interno, plano "se-então". A meta-análise encontrou efeito pequeno a médio (g ≈ 0,24 a 0,34) {{3:17}}, e só cerca de 16% das pessoas fazem isso espontaneamente {{3:16}}.</p>

COURSE.levels.push({
  id: 5, slug: 'nivel-5', semana: 'Semana 6', nota: 'R$ 50', cor: 'lv5',
  titulo: 'Como o milionário de verdade pensa',
  tese: 'O milionário real é, quase sempre, alguém que gastou menos do que ganhou por muito tempo e deixou o tempo trabalhar. Riqueza é o que você não vê.',
  missao: 'Ao final desta semana você terá calculado onde está em relação ao patrimônio esperado, escrito sua lista de inversão (o que você nunca fará) e definido por escrito o que é "suficiente" para você.',
  habilidades: ['Medir-se pelo patrimônio, não pela renda', 'Frugalidade conspícua', 'Inversão (Munger)', 'Círculo de competência', 'Separar sorte de método'],

  aulas: [
    {
      t: 'O acumulador e o consumidor',
      body: `<p>Thomas Stanley e William Danko entrevistaram 1.115 milionários americanos nos anos 1990. A fórmula deles: <strong>patrimônio esperado = idade × renda anual ÷ 10</strong>. Quem tem o dobro disso é um acumulador prodigioso (PAW); quem tem metade ou menos, um subacumulador (UAW) {{4:1}}.</p>
<p>Os milionários da amostra viviam com menos de 7% do patrimônio por ano e investiam mais de 20% da renda {{4:2}}. A maioria morava na mesma casa havia 20 anos, e três quartos nunca gastaram mais de US$ 600 num terno {{4:2}}. Os autores chamaram isso de <em>frugalidade conspícua</em>, o oposto do consumo de status de Veblen {{4:32}}.</p>
<p>O estudo da Ramsey Solutions, com mais de 10 mil milionários, aponta na mesma direção: 79% não herdaram nada, 94% vivem com menos do que ganham, quase três quartos nunca carregaram saldo no cartão e 75% atribuem o resultado a investir de forma regular. Advogado está entre as cinco profissões mais comuns {{4:6}}. Atenção aos limites: parte da amostra vem do próprio painel da empresa e o grupo tem escolaridade muito acima da média {{4:7}}.</p>
<p>Por que gastamos para parecer? O gasto com bens visíveis responde à renda do grupo de referência ao nosso redor {{4:31}}, e o consumo de status aumenta o endividamento, sobretudo de quem tem menos {{4:32}}. Para um advogado, o grupo de referência é caro: carro, roupa, restaurante. A pergunta-filtro é simples: <em>isto é para mim ou para quem está olhando?</em></p>`,

<p>Housel conta dois casos: um ex-executivo de Wall Street que declarou falência pessoal, e uma secretária frugal que deixou fortuna depois de cerca de 80 anos de juros compostos {{4:10}}. E lembra que, dos US$ 84,5 bilhões de Buffett na época do livro, US$ 81,5 bilhões vieram depois dos 65 anos {{4:9}}. O tempo de permanência pesou mais que o talento.</p>
<p>Duas ideias completam o modelo. <b>Suficiente:</b> o escritor Joseph Heller, numa festa de bilionário, disse ter algo que o anfitrião nunca teria: a consciência de ter o suficiente {{8:18}}. Sem um "suficiente" definido, todo aumento de renda vira aumento de padrão de vida. <b>Margem de erro:</b> um plano que só funciona se tudo der certo não é plano {{4:9}}.</p>
<div class="callout"><b>Brasil sem ilusão.</b> O país tinha 433 mil milionários em dólar (UBS 2025) e Gini de riqueza de 0,82, entre os piores do mundo {{4:34}}. O topo paga alíquota efetiva menor que a média {{4:36}}. Esforço conta, mas o sistema não é neutro. O curso não promete que "basta querer". Promete método.</div>`,

<p><b>Círculo de competência (Buffett):</b> o tamanho do círculo não importa, conhecer os limites dele é vital {{4:14}}. Só invista no que consegue explicar em duas frases.</p>

<p><b>Alavancagem sem permissão (Naval):</b> "Você não vai enriquecer alugando seu tempo." Código e mídia escalam sem pedir licença a ninguém {{4:13}}. Detalhado no Nível 7.</p>
<p><b>Sorte existe.</b> Num modelo de simulação, os mais bem-sucedidos raramente eram os mais talentosos, e sim os que tiveram mais eventos de sorte {{4:23}}. Livros de sucesso estudam sobreviventes, não quem fez igual e quebrou {{4:24}}. A lição útil: aumente a exposição a oportunidades e reduza a exposição à ruína.</p>
<p><b>O que evitar:</b> o modelo de seminário "grátis" que vende curso caro e incentiva o aluno a abrir cartão novo para pagar foi documentado pela FTC no caso Zurixx {{4:22}}. A empresa de Kiyosaki pediu falência em 2012 após condenação de cerca de US$ 23,7 milhões {{4:19}}, e ele próprio disse em 2024 dever mais de US$ 1 bilhão {{4:20}}. A distinção entre ativo e passivo é útil; "dívida boa" como atalho para quem está endividado, não.</p>

<script>
/* Videos animados: cada video é uma sequência de cenas desenhadas em canvas.
   draw(g, p) recebe g (helpers + contexto) e p (progresso 0..1 da cena). */
(function () {
  const E = t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
  const seg = (p, a, b) => E((p - a) / (b - a));
  const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');

  function helpers(ctx, W, H, C) {
    const K = H < 280 ? 1.3 : 1;
    const F = (s, w) => (w || 500) + ' ' + Math.round(s * K) + 'px ' + C.fontBody;
    const D = (s) => '600 ' + Math.round(s * K) + 'px ' + C.fontDisplay;
    const g = {
      ctx, W, H, C, E, seg, brl,
      clear() { ctx.fillStyle = C.screen; ctx.fillRect(0, 0, W, H); g.guil(); },
      guil() {
        ctx.save(); ctx.globalAlpha = 0.08; ctx.strokeStyle = C.accent; ctx.lineWidth = 1;
        const cx = W * 0.86, cy = H * 0.2, R = H * 0.22;
        for (let k = 0; k < 18; k++) {
          ctx.beginPath();
          for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.04) {
            const r = R * (0.7 + 0.3 * Math.sin(7 * a + k * 0.35));
            const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
            a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        ctx.restore();
      },
      text(s, x, y, size, color, align, weight, alpha) {
        ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
        ctx.font = F(size * H / 360, weight); ctx.fillStyle = color || C.ink;
        ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(s, x, y); ctx.restore();
      },
      disp(s, x, y, size, color, align, alpha) {
        ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
        ctx.font = D(size * H / 360); ctx.fillStyle = color || C.ink;
        ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(s, x, y); ctx.restore();
      },
      wrap(s, x, y, maxW, size, color, align, alpha) {
        ctx.save(); ctx.font = F(size * H / 360); const words = s.split(' '); let line = ''; const lines = [];
        for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
        lines.push(line); ctx.restore();
        const lh = size * H / 360 * 1.3;
        lines.forEach((l, i) => g.text(l, x, y + i * lh - (lines.length - 1) * lh / 2, size, color, align, 500, alpha));
      },
      rect(x, y, w, h, color, alpha, r) {
        ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = color;
        if (r && ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); } else ctx.fillRect(x, y, w, h);
        ctx.restore();
      },
      line(x1, y1, x2, y2, color, w, alpha, dash) {
        ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.strokeStyle = color; ctx.lineWidth = (w || 2) * H / 360;
        if (dash) ctx.setLineDash(dash.map(d => d * H / 360));
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
      },
      circle(x, y, r, color, alpha, stroke) {
        ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = stroke * H / 360; ctx.stroke(); } else { ctx.fillStyle = color; ctx.fill(); }
        ctx.restore();
      },
      arrow(x1, y1, x2, y2, color, p) {
        const x = x1 + (x2 - x1) * p, y = y1 + (y2 - y1) * p;
        g.line(x1, y1, x, y, color, 2.5);
        if (p > 0.95) {
          const a = Math.atan2(y2 - y1, x2 - x1), L = 9 * H / 360;
          ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x2, y2);
          ctx.lineTo(x2 - L * Math.cos(a - 0.45), y2 - L * Math.sin(a - 0.45));
          ctx.lineTo(x2 - L * Math.cos(a + 0.45), y2 - L * Math.sin(a + 0.45)); ctx.fill(); ctx.restore();
        }
      },
      path(pts, color, w, p) {
        if (pts.length < 2) return; const n = Math.max(2, Math.floor(pts.length * (p == null ? 1 : p)));
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = (w || 2.5) * H / 360; ctx.lineJoin = 'round';

      },
      axes(x0, y0, x1, y1, xl, yl) {
        g.line(x0, y1, x1, y1, C.muted, 1.2); g.line(x0, y0, x0, y1, C.muted, 1.2);
        if (xl) g.text(xl, x1, y1 + 16 * H / 360, 10, C.muted, 'right');
        if (yl) g.text(yl, x0, y0 - 12 * H / 360, 10, C.muted, 'left');
      },
      img(im, x, y, w, h, alpha) { if (!im || !im.complete || !im.naturalWidth) return; ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.drawImage(im, x, y, w, h); ctx.restore(); },

      icon(k, x, y, size, alpha, col) { const s = size; g.rect(x - s * 0.75, y - s * 0.75, s * 1.5, s * 1.5, col || C.accent, 0.13 * (alpha == null ? 1 : alpha), s * 0.4); g.img(icoImg(k, col || C.accent), x - s / 2, y - s / 2, s, s, alpha); },

        g.text(kick, g.W / 2, g.H * 0.3, 11, C.accent, 'center', 700, a);
        ctx.save(); ctx.translate(0, (1 - b) * g.H * 0.04); g.disp(ttl, g.W / 2, g.H * 0.5, 36, C.ink, 'center', b); ctx.restore();
        g.text(sub, g.W / 2, g.H * 0.64, 15, C.muted, 'center', 500, c);
      },
      endCard(t1, t2, p) {
        g.clear(); const a = seg(p, 0, 0.3), b = seg(p, 0.15, 0.45);
        g.circle(g.W / 2, g.H * 0.36, g.H * 0.07 * a, C.good, 0.9); if (a > 0.6) { ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4 * g.H / 360; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(g.W / 2 - g.H * 0.03, g.H * 0.36); ctx.lineTo(g.W / 2 - g.H * 0.005, g.H * 0.385); ctx.lineTo(g.W / 2 + g.H * 0.035, g.H * 0.335); ctx.stroke(); ctx.restore(); }
        g.disp(t1, g.W / 2, g.H * 0.53, 28, C.ink, 'center', a); g.text(t2, g.W / 2, g.H * 0.65, 15, C.muted, 'center', 500, b);

        <h2 class="h-sm">Agora é a sua vez</h2><div class="ex your"><div class="exbody"></div><p class="small saved"></p></div>
        <h2 class="h-sm">Está pronto quando…</h2><div class="pronto">${G.pronto.map((p, i) => `<label class="check"><input type="checkbox" data-pr="${i}" ${d._pr[i] ? 'checked' : ''}><span>${esc(p)}</span></label>`).join('')}</div><p class="small pr-hint" aria-live="polite"></p>`;
      const persist = () => { save(); const s = $('.saved', b); if (s) s.textContent = 'Salvo automaticamente às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
      (W[e.tipo] || W.fields)($('.exbody', b), e, d, persist, lv);
      const hint = () => { const f = G.pronto.filter((p, i) => !d._pr[i]).length; $('.pr-hint', b).textContent = f ? `Falta marcar ${f} item(ns). Se precisar parar agora, tudo bem: o que você escreveu fica salvo.` : 'Tudo certo! Pode concluir a parada.'; };
      $$('[data-pr]', b).forEach(x => x.onchange = () => { d._pr[x.dataset.pr] = x.checked; save(); hint(); }); hint();
      nextBtn.textContent = S.done[e.id] ? 'Próxima parada →' : 'Concluir parada ✓';
      nextBtn.onclick = () => { S.done[e.id] = true; save(); finish(); };
    } else if (cur.tipo === 'prova') {
      b.innerHTML = anaSay(`Último passo! São ${lv.prova.length} perguntas rapidinhas sobre o que você viu. Para passar, acerte ${passMin(lv.prova)}. Se errar, eu mostro a resposta certa e você pode tentar de novo quantas vezes quiser.`) +
        `<div class="callout"><b>Hábito da semana:</b> ${esc(lv.pratica)} <div class="cta-row"><button class="btn" type="button" data-act="ritual">Abrir o ritual de hoje</button></div></div><div id="quiz"></div>`;
      const nx = L[lv.id];
      nextBtn.textContent = passed(lv.id) && nx ? `Ir para o Nível ${nx.id} →` : 'Voltar ao início';
      nextBtn.onclick = () => { location.hash = passed(lv.id) && nx ? nx.slug : ''; };
      quizFor(lv);
    }
  }
  function quizFor(lv) {
    renderQuiz($('#quiz'), lv.prova, r => {
      const prev = S.quiz[lv.id] || { best: 0 }; const ok = r.score >= passMin(lv.prova);
      if (ok && !prev.passed) setTimeout(() => celebrate(lv.id === CFG.nivelGratis && !isFull() ? 'fim' : 'nivel', { nivel: lv.id }), 400);
      S.quiz[lv.id] = { best: Math.max(prev.best || 0, r.score), passed: prev.passed || ok, at: today() };
      if (ok) lv.cards.forEach((c, i) => { const id = lv.id + '-' + i; if (!S.srs[id]) S.srs[id] = { box: 0, due: addDays(today(), 1) }; });
      save(); return ok;
    }, () => render());
  }
  function toast(t) {
    const o = document.createElement('div'); o.className = 'toast'; o.setAttribute('role', 'status');
    o.innerHTML = `<span>${esc(t)}</span>`; document.body.appendChild(o);
    setTimeout(() => o.classList.add('fade'), 2200); setTimeout(() => o.remove(), 2800);
  }

  /* ---------- Router ---------- */
  function render() {
    closePop(); $$('[data-video]').forEach(el => el._stop && el._stop()); try { speechSynthesis.cancel(); } catch (e) { }
    const h = (location.hash || '').replace('#', ''); const lv = levelBy(h);
    let html, bind = () => { };
    if (lv && lockedPaid(lv.id)) { html = completo(lv); bind = bindCompleto; }
    else if (lv) { html = level(lv); bind = () => bindLevel(lv); }
    else if (h === 'inscricao') { const ver = !S.insc || S._verForm; html = ver ? inscricao() : home(); bind = ver ? bindInsc : () => { }; S._verForm = false; }
    else if (h === 'admin') { html = adminPage(); bind = bindAdmin; }
    else if (h === 'completo') { html = completo(null); bind = bindCompleto; }
    else if (h === 'contribuir') { html = contribuir(); bind = bindContribuir; }
    else if (h === 'marco-zero') { html = marco(false); bind = () => bindMarco(false); }
    else if (h === 'marco-final') { html = marco(true); bind = () => bindMarco(true); }
    else if (h === 'revisao') { html = review(); bind = bindReview; }
    else if (h === 'biblioteca') { html = library(); bind = bindLibrary; }
    else if (h === 'final') { html = finalPage(); bind = bindFinal; }
    else if (h === 'constituicao') { html = constitution(); bind = bindConst; }
    else html = home();
    app.innerHTML = html; setSync(syncState);
    $$('[data-act="ritual"]').forEach(a => a.onclick = ev => { ev.preventDefault(); ritual(); });
    $$('[data-locked]').forEach(a => a.onclick = ev => ev.preventDefault());
    bind(); requestAnimationFrame(paintGuils); timerMount();
    const titles = { 'revisao': 'Revisão', 'biblioteca': 'Fontes', 'final': 'Prova final', 'constituicao': 'Constituição' };
    if (render._last !== h) { window.scrollTo(0, 0); render._last = h; }
  }
  window.addEventListener('hashchange', render);
  window.addEventListener('resize', debounce(paintGuils, 300));
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintGuils);
  new MutationObserver(paintGuils).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  render();
})();

</script>
</body></html>
